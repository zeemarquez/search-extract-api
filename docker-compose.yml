# search-extract-api — full stack with one command:
#
#   docker compose up -d
#
# Services: the API, SearXNG (JSON output enabled), Valkey (cache), Crawl4AI (headless
# browser rendering) and the encrypted session store (the `sessions` volume).
# SearXNG's settings (deploy/searxng/) are baked into a local image: after changing them run
# `docker compose build searxng`. Only named volumes are used (no host bind mounts), so the
# file also deploys as-is on Compose importers such as Openship.
# Optional local LLM: add the override file and set LLM_BASE_URL=http://ollama:11434/v1:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
# Every setting can be overridden from a `.env` file (see .env.example).

name: search-extract-api

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    image: search-extract-api:0.1.0
    restart: unless-stopped
    ports:
      # Localhost only by default. Set API_BIND=0.0.0.0 (and API_KEYS!) to expose it.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
      CRAWL4AI_TOKEN: ${CRAWL4AI_API_TOKEN:-change-me-crawl4ai-internal-token}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      SESSIONS_DB_PATH: /data/sessions.db
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sessions:/data
    shm_size: 512mb
    depends_on:
      valkey:
        condition: service_healthy
      searxng:
        condition: service_started
      crawl4ai:
        condition: service_started
    logging: *logging

  searxng:
    build: ./deploy/searxng
    image: search-extract-searxng:local
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  valkey:
    image: docker.io/valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    # Pure cache: no persistence. Sessions live in the encrypted SQLite store instead.
    command: ["valkey-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "${VALKEY_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  crawl4ai:
    image: docker.io/unclecode/crawl4ai:0.9.5
    restart: unless-stopped
    shm_size: 1gb
    environment:
      # Crawl4AI >= 0.9 only listens on the network when a token is set.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-change-me-crawl4ai-internal-token}
      CRAWL4AI_MAX_TIMEOUT_MS: "120000"
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
    healthcheck:
      # The image's own check also fails on machines with less than 2 GB of RAM in total
      # (e.g. Docker Desktop's default VM) although the server works: probe the server only.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${CRAWL4AI_MEMORY:-4g}
    logging: *logging

volumes:
  sessions:
  searxng-cache:
