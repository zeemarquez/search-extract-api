# Optional local LLM for search-extract-api. Combine with the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#
# and set LLM_BASE_URL=http://ollama:11434/v1 in `.env`. `ollama-pull` downloads the chat
# and embeddings models (LLM_CHAT_MODEL, EMBEDDINGS_MODEL) once and exits.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: docker.io/ollama/ollama:0.40.6
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    logging: *logging

  ollama-pull:
    image: docker.io/ollama/ollama:0.40.6
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 3 && ollama pull ${LLM_CHAT_MODEL:-qwen2.5:7b-instruct} && ollama pull ${EMBEDDINGS_MODEL:-bge-m3}"
    restart: "no"
    logging: *logging

volumes:
  ollama:
